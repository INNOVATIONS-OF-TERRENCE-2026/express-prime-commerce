name: Privileged Secret Guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privileged-secret-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4

      - name: Verify previously exposed files stay removed
        shell: bash
        run: |
          set -euo pipefail
          test ! -f .env
          test ! -f src/lib/supabaseAdmin.ts

      - name: Reject privileged Supabase keys in application source
        shell: bash
        run: |
          set -euo pipefail

          vite_matches="$(git grep -l 'VITE_SUPABASE_SERVICE_ROLE_KEY' -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' '*.md' '*.toml' || true)"
          if [ -n "$vite_matches" ]; then
            echo "Browser-exposed Supabase service role reference detected in:"
            echo "$vite_matches"
            exit 1
          fi

          secret_matches="$(git grep -l -E 'sb_secret_[A-Za-z0-9_-]{20,}' -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' '*.md' '*.toml' || true)"
          if [ -n "$secret_matches" ]; then
            echo "Supabase secret key literal detected in:"
            echo "$secret_matches"
            exit 1
          fi

          echo "Privileged credential guard passed."
