name: Privileged Secret Guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privileged-secret-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reject committed privileged credentials
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');

          const self = '.github/workflows/secret-scan.yml';
          const files = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' })
            .split('\0')
            .filter(Boolean);

          const findings = [];

          for (const file of files) {
            if (file === self || file === '.env.example') continue;

            if (/(^|\/)\.env($|\.)/.test(file)) {
              findings.push(`${file}: tracked environment file`);
            }

            let buf;
            try {
              buf = fs.readFileSync(file);
            } catch {
              continue;
            }

            if (buf.includes(0)) continue;
            const text = buf.toString('utf8');

            if (/VITE_SUPABASE_SERVICE_ROLE_KEY/.test(text)) {
              findings.push(`${file}: browser-exposed Supabase service-role variable`);
            }

            if (/sb_secret_[A-Za-z0-9_-]{20,}/.test(text)) {
              findings.push(`${file}: Supabase secret API key literal`);
            }

            if (/SUPABASE_SERVICE_ROLE_KEY\s*=\s*["'][^"']+["']/.test(text)) {
              findings.push(`${file}: hardcoded Supabase service-role assignment`);
            }

            const jwtPattern = /eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}/g;
            const tokens = text.match(jwtPattern) || [];

            for (const token of tokens) {
              try {
                const payloadPart = token.split('.')[1]
                  .replace(/-/g, '+')
                  .replace(/_/g, '/');
                const padded = payloadPart + '='.repeat((4 - payloadPart.length % 4) % 4);
                const payload = JSON.parse(Buffer.from(padded, 'base64').toString('utf8'));

                if (payload && payload.role === 'service_role') {
                  findings.push(`${file}: legacy Supabase service_role JWT literal`);
                  break;
                }
              } catch {
                // Ignore strings that only resemble JWTs.
              }
            }
          }

          if (findings.length) {
            console.error('Privileged credential guard failed:');
            for (const finding of findings) console.error(`- ${finding}`);
            process.exit(1);
          }

          console.log('Privileged credential guard passed.');
          NODE
