name: Privileged Secret Guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privileged-secret-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reject tracked environment files and privileged Supabase keys
        shell: bash
        run: |
          set -euo pipefail

          bad_env="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '^\.env\.example$' || true)"
          if [ -n "$bad_env" ]; then
            echo "Tracked environment files are prohibited:"
            echo "$bad_env"
            exit 1
          fi

          bad_files="$(git grep -l -E 'VITE_SUPABASE_SERVICE_ROLE_KEY|sb_secret_[A-Za-z0-9_-]{20,}' -- . ':!.github/workflows/secret-scan.yml' || true)"
          if [ -n "$bad_files" ]; then
            echo "Privileged Supabase credential material detected in:"
            echo "$bad_files"
            exit 1
          fi

          echo "Privileged credential guard passed."
